name: security-portfolio-live-smoke

on:
  push:
    branches: [main]
    paths:
      - 'security-portfolio.html'
      - 'security-portfolio.js'
      - 'enterprise.html'
      - 'enterprise.js'
      - 'core/security-posture.mjs'
      - '.github/workflows/security-portfolio-smoke.yml'

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public TrustReady Security Portfolio is reachable
        run: |
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://mikelninh.github.io/trustready/security-portfolio.html \
            -o /tmp/security-portfolio.html
          grep -q 'Security Evidence Portfolio' /tmp/security-portfolio.html
          grep -q 'compromised-model replays' /tmp/security-portfolio.html

      - name: Verify public enterprise autonomous-security page is reachable
        run: |
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://mikelninh.github.io/trustready/enterprise.html \
            -o /tmp/enterprise.html
          grep -q 'Watch an unsafe agent harden itself' /tmp/enterprise.html
          grep -q 'SafeVoice: prove which path is actually reachable' /tmp/enterprise.html
          grep -q 'Connect.*Resolve.*Attack.*Fix.*Prove.*Ship' /tmp/enterprise.html

      - name: Verify all published project postures are reachable and parseable
        shell: bash
        run: |
          set -euo pipefail
          repos=(
            mikelninh/gitlaw
            mikelninh/digital-worker-factory
            mikelninh/care-os
            mikelninh/pruefpilot
            mikelninh/missionops-plan
            mikelninh/safevoice
            mikelninh/fraudflow-dkb
            mikelninh/drv-signallab
          )
          mkdir -p /tmp/security-postures
          for repo in "${repos[@]}"; do
            name="${repo#*/}"
            curl --fail --silent --show-error --location \
              --retry 6 --retry-delay 2 --retry-all-errors \
              "https://raw.githubusercontent.com/${repo}/main/security/security-posture.json" \
              -o "/tmp/security-postures/${name}.json"
          done
          node <<'NODE'
          const fs = require('fs')
          const path = '/tmp/security-postures'
          const files = fs.readdirSync(path).filter((name) => name.endsWith('.json'))
          if (files.length !== 8) throw new Error(`expected 8 postures, found ${files.length}`)
          for (const file of files) {
            const p = JSON.parse(fs.readFileSync(`${path}/${file}`, 'utf8'))
            if (p.version !== 'security-posture/v1') throw new Error(`${file}: invalid version`)
            if (p.adversarial?.criticalEscapes !== 0) throw new Error(`${file}: critical impact escape present`)
            if (p.claims?.productionSecure || p.claims?.promptInjectionSolved || p.claims?.certified) throw new Error(`${file}: unsupported claim present`)
          }
          const safevoice = JSON.parse(fs.readFileSync(`${path}/safevoice.json`, 'utf8'))
          if (safevoice.adversarial?.cases !== 2 || safevoice.adversarial?.passed !== 2) throw new Error('SafeVoice dedicated adversarial evidence missing')
          console.log(`Live evidence reachable: ${files.length}/8 postures; SafeVoice=${safevoice.adversarial.passed}/${safevoice.adversarial.cases}`)
          NODE

      - name: Verify compromised-model replay evidence is live and zero-impact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 2 --retry-all-errors \
            https://raw.githubusercontent.com/mikelninh/digital-worker-factory/main/security/live-replay-report.json \
            -o /tmp/live-replay-report.json
          node <<'NODE'
          const fs = require('fs')
          const report = JSON.parse(fs.readFileSync('/tmp/live-replay-report.json', 'utf8'))
          if (report.version !== 'live-adversarial-replay/v1') throw new Error('invalid live replay version')
          if (report.summary.cases < 1 || report.summary.passed !== report.summary.cases) throw new Error('live replay regression')
          if (report.summary.liveModelCases < 1) throw new Error('no live-model capture evidence')
          if (report.summary.impactEscapes !== 0) throw new Error('live-model impact escape present')
          if (report.summary.executorCalls !== 0) throw new Error('unsafe executor call present')
          console.log(`Live compromised-model evidence: ${report.summary.passed}/${report.summary.cases}; executor calls=${report.summary.executorCalls}; impact escapes=${report.summary.impactEscapes}`)
          NODE

      - name: Verify autonomous attack-fix-retest evidence is live and zero-impact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 2 --retry-all-errors \
            https://raw.githubusercontent.com/mikelninh/digital-worker-factory/main/enterprise/autonomous-security-loop-report.json \
            -o /tmp/autonomous-loop.json
          node <<'NODE'
          const fs = require('fs')
          const report = JSON.parse(fs.readFileSync('/tmp/autonomous-loop.json', 'utf8'))
          if (report.version !== 'autonomous-security-loop/v1') throw new Error('invalid autonomous loop report')
          if (report.attacks?.generated < 1) throw new Error('no generated attack coverage')
          if (report.before?.impactEscapes < 1 || report.before?.executorCalls < 1) throw new Error('missing exploit-before-fix proof')
          if (report.remediation?.automatic !== true || report.remediation?.changed !== true) throw new Error('automatic remediation evidence missing')
          if (report.after?.impactEscapes !== 0) throw new Error('post-remediation impact escape present')
          if (report.after?.executorCalls !== 0) throw new Error('post-remediation executor call present')
          if (report.release?.decision !== 'TECHNICAL_GO') throw new Error(`unexpected technical release decision: ${report.release?.decision}`)
          if (!/not legal compliance certification/i.test(report.truthBoundary ?? '')) throw new Error('autonomous-loop truth boundary missing')
          console.log(`Autonomous loop: ${report.before.impactEscapes} escapes before -> ${report.after.impactEscapes} after; executor calls after=${report.after.executorCalls}; ${report.release.decision}`)
          NODE

      - name: Verify real-repo SafeVoice reachability proof is live and scoped
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 2 --retry-all-errors \
            https://raw.githubusercontent.com/mikelninh/digital-worker-factory/main/enterprise/safevoice-reachability-proof.json \
            -o /tmp/safevoice-reachability-proof.json
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 2 --retry-all-errors \
            https://raw.githubusercontent.com/mikelninh/safevoice/main/security/agent-boundary-report.json \
            -o /tmp/safevoice-agent-boundary.json
          node <<'NODE'
          const fs = require('fs')
          const proof = JSON.parse(fs.readFileSync('/tmp/safevoice-reachability-proof.json', 'utf8'))
          const native = JSON.parse(fs.readFileSync('/tmp/safevoice-agent-boundary.json', 'utf8'))
          if (proof.version !== 'repository-reachability-proof/v1') throw new Error('invalid reachability proof version')
          if (proof.target?.repository !== 'mikelninh/safevoice') throw new Error('wrong reachability target')
          if (proof.chain?.entrypoint !== 'backend/app/services/court_prep_agent.py') throw new Error('wrong SafeVoice entrypoint')
          if (proof.chain?.reachableTools?.length !== 8) throw new Error('SafeVoice reachable tool surface drift')
          if (!proof.chain?.isolatedSurfaces?.includes('safevoice_mcp/server.py')) throw new Error('SafeVoice MCP isolation missing')
          if (!proof.chain?.effectPaths?.some((p) => p.tool === 're_archive_urls' && p.sink?.kind === 'network_effect')) throw new Error('SafeVoice network effect path missing')
          if (proof.nativeRuntimeEvidence?.adversarialCases !== 2 || proof.nativeRuntimeEvidence?.passed !== 2 || proof.nativeRuntimeEvidence?.criticalEscapesAfterBoundary !== 0 || proof.nativeRuntimeEvidence?.exploitBeforeFix !== true) throw new Error('SafeVoice runtime proof regression')
          if (native.summary?.adversarialCases !== 2 || native.summary?.passed !== 2 || native.summary?.criticalEscapesAfterBoundary !== 0) throw new Error('SafeVoice native report mismatch')
          if (proof.release?.decision !== 'TECHNICAL_GO' || proof.release?.scopeType !== 'entrypoint_scoped') throw new Error('SafeVoice scoped release regression')
          if (!/scoped/i.test(proof.truthBoundary ?? '')) throw new Error('SafeVoice scope truth boundary missing')
          console.log(`SafeVoice reachability: ${proof.chain.reachableTools.length} tools; isolated MCP=${proof.chain.isolatedSurfaces.length}; native=${proof.nativeRuntimeEvidence.passed}/${proof.nativeRuntimeEvidence.adversarialCases}; escapes=${proof.nativeRuntimeEvidence.criticalEscapesAfterBoundary}; ${proof.release.decision}`)
          NODE

      - name: Verify enterprise go-live report is live and internally consistent
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 2 --retry-all-errors \
            https://raw.githubusercontent.com/mikelninh/digital-worker-factory/main/enterprise/demo-go-live-report.json \
            -o /tmp/go-live.json
          node <<'NODE'
          const fs = require('fs')
          const report = JSON.parse(fs.readFileSync('/tmp/go-live.json', 'utf8'))
          if (report.version !== 'enterprise-go-live-report/v1') throw new Error('invalid enterprise go-live report')
          if (report.decision?.decision !== 'GO') throw new Error(`unexpected demo decision: ${report.decision?.decision}`)
          if (report.decision?.summary?.blockers !== 0) throw new Error('demo go-live report has blockers')
          if (!/not .*certification/i.test(report.truthBoundary ?? '')) throw new Error('truth boundary missing')
          console.log(`Enterprise go-live demo: ${report.decision.decision}; blockers=${report.decision.summary.blockers}`)
          NODE
