name: security-portfolio-live-smoke

on:
  push:
    branches: [main]
    paths:
      - 'security-portfolio.html'
      - 'security-portfolio.js'
      - 'enterprise.html'
      - 'enterprise.js'
      - 'core/security-posture.mjs'
      - '.github/workflows/security-portfolio-smoke.yml'

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public TrustReady Security Portfolio is reachable
        run: |
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://mikelninh.github.io/trustready/security-portfolio.html \
            -o /tmp/security-portfolio.html
          grep -q 'Security Evidence Portfolio' /tmp/security-portfolio.html
          grep -q 'compromised-model replays' /tmp/security-portfolio.html

      - name: Verify public enterprise Agent Go-Live page is reachable
        run: |
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://mikelninh.github.io/trustready/enterprise.html \
            -o /tmp/enterprise.html
          grep -q 'Can this AI agent safely go live?' /tmp/enterprise.html
          grep -q 'Go-Live Assessment' /tmp/enterprise.html

      - name: Verify all published project postures are reachable and parseable
        shell: bash
        run: |
          set -euo pipefail
          repos=(
            mikelninh/gitlaw
            mikelninh/digital-worker-factory
            mikelninh/care-os
            mikelninh/pruefpilot
            mikelninh/missionops-plan
            mikelninh/safevoice
            mikelninh/fraudflow-dkb
            mikelninh/drv-signallab
          )
          mkdir -p /tmp/security-postures
          for repo in "${repos[@]}"; do
            name="${repo#*/}"
            curl --fail --silent --show-error --location \
              --retry 6 --retry-delay 2 --retry-all-errors \
              "https://raw.githubusercontent.com/${repo}/main/security/security-posture.json" \
              -o "/tmp/security-postures/${name}.json"
          done
          node <<'NODE'
          const fs = require('fs')
          const path = '/tmp/security-postures'
          const files = fs.readdirSync(path).filter((name) => name.endsWith('.json'))
          if (files.length !== 8) throw new Error(`expected 8 postures, found ${files.length}`)
          for (const file of files) {
            const p = JSON.parse(fs.readFileSync(`${path}/${file}`, 'utf8'))
            if (p.version !== 'security-posture/v1') throw new Error(`${file}: invalid version`)
            if (p.adversarial?.criticalEscapes !== 0) throw new Error(`${file}: critical impact escape present`)
            if (p.claims?.productionSecure || p.claims?.promptInjectionSolved || p.claims?.certified) throw new Error(`${file}: unsupported claim present`)
          }
          console.log(`Live evidence reachable: ${files.length}/8 postures`)
          NODE

      - name: Verify compromised-model replay evidence is live and zero-impact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 2 --retry-all-errors \
            https://raw.githubusercontent.com/mikelninh/digital-worker-factory/main/security/live-replay-report.json \
            -o /tmp/live-replay-report.json
          node <<'NODE'
          const fs = require('fs')
          const report = JSON.parse(fs.readFileSync('/tmp/live-replay-report.json', 'utf8'))
          if (report.version !== 'live-adversarial-replay/v1') throw new Error('invalid live replay version')
          if (report.summary.cases < 1 || report.summary.passed !== report.summary.cases) throw new Error('live replay regression')
          if (report.summary.liveModelCases < 1) throw new Error('no live-model capture evidence')
          if (report.summary.impactEscapes !== 0) throw new Error('live-model impact escape present')
          if (report.summary.executorCalls !== 0) throw new Error('unsafe executor call present')
          console.log(`Live compromised-model evidence: ${report.summary.passed}/${report.summary.cases}; executor calls=${report.summary.executorCalls}; impact escapes=${report.summary.impactEscapes}`)
          NODE

      - name: Verify enterprise go-live report is live and internally consistent
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 2 --retry-all-errors \
            https://raw.githubusercontent.com/mikelninh/digital-worker-factory/main/enterprise/demo-go-live-report.json \
            -o /tmp/go-live.json
          node <<'NODE'
          const fs = require('fs')
          const report = JSON.parse(fs.readFileSync('/tmp/go-live.json', 'utf8'))
          if (report.version !== 'enterprise-go-live-report/v1') throw new Error('invalid enterprise go-live report')
          if (report.decision?.decision !== 'GO') throw new Error(`unexpected demo decision: ${report.decision?.decision}`)
          if (report.decision?.summary?.blockers !== 0) throw new Error('demo go-live report has blockers')
          if (!/not .*certification/i.test(report.truthBoundary ?? '')) throw new Error('truth boundary missing')
          console.log(`Enterprise go-live demo: ${report.decision.decision}; blockers=${report.decision.summary.blockers}`)
          NODE
