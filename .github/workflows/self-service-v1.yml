name: self-service-v1

on:
  pull_request:
    paths:
      - 'core/agent-repo-scanner*'
      - 'self-service/**'
      - 'product-architecture/self-service/**'
      - 'package.json'
      - '.github/workflows/self-service-v1.yml'
  push:
    branches: [main]
    paths:
      - 'core/agent-repo-scanner*'
      - 'self-service/**'
      - 'product-architecture/self-service/**'
      - 'package.json'
      - '.github/workflows/self-service-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          node --check core/agent-repo-scanner.mjs
          node --check self-service/self-service.mjs
          node --check self-service/local-collector.mjs
          node --check self-service/connected-runner.mjs
          node --check self-service/cli.mjs
      - name: Unit and golden cases
        run: node --test core/agent-repo-scanner.test.mjs self-service/self-service.test.mjs
      - name: CLI source preflight never overclaims runtime GO
        run: |
          node self-service/cli.mjs scan . > /tmp/self-service-scan.json || true
          node - <<'NODE'
          const r=require('/tmp/self-service-scan.json')
          if(r.release?.decision==='TECHNICAL_GO') throw new Error('source-only scan overclaimed runtime GO')
          if(!/not a penetration test/i.test(r.truthBoundary)) throw new Error('truth boundary missing')
          NODE

  owned-repo-canary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TrustReady
        uses: actions/checkout@v4
      - name: Checkout pinned owned agent system
        uses: actions/checkout@v4
        with:
          repository: mikelninh/digital-worker-factory
          ref: 7712e3e3ec215fbbabd055a652433d138d1015c7
          path: _canary/factory
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run real connected Security Delta proof
        run: |
          node self-service/connected-runner.mjs _canary/factory > /tmp/canary.json
          node - <<'NODE'
          const r=require('/tmp/canary.json')
          if(r.status!=='TECHNICAL_GO') throw new Error(`canary status=${r.status}`)
          if(r.recipe!=='node-enterprise-security-delta') throw new Error(`unexpected recipe=${r.recipe}`)
          if(r.validation?.metrics?.afterImpactEscapes!==0) throw new Error('canary impact escape')
          if(r.validation?.metrics?.benignCases!==r.validation?.metrics?.benignRetained) throw new Error('canary benign regression')
          console.log('OWNED REPO CANARY PASS:', r.validation.metrics)
          NODE
