name: trustready-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  trust-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run fail-closed trust-kernel, scanner and billing tests
        run: npm test
      - name: Run labelled scanner safety benchmark
        run: npm run benchmark:scanner
      - name: Run reproducible legal pre-audit
        run: npm run audit:legal
      - name: Prove Bao pilot defaults stay synthetic and fail-closed
        run: npm run readiness:bao
      - name: Validate three-role audit request pack and external verdict boundary
        run: |
          npm run audit:request-pack -- bao-legal-shadow > /tmp/legal-audit-request-pack.json
          node -e "const fs=require('fs'); const raw=fs.readFileSync('/tmp/legal-audit-request-pack.json','utf8'); const i=raw.indexOf('{'); const p=JSON.parse(raw.slice(i)); const independent=p.roles?.independent_auditor; const claims=independent?.claims||[]; if(p.schema!=='trustready-legal-audit-request-pack-v2'||!p.roles?.runtime_security||!p.roles?.legal_privacy||!independent||p.separation_rules.length<7||!claims.some(c=>c.name==='organizational_independence'&&c.evidence_level==='E4')||independent.final_verdict?.required!==true||independent.final_verdict?.issued_outside_local_preaudit!==true) process.exit(1); console.log(p.schema,Object.keys(p.roles).length,claims.length,independent.final_verdict.required)"
      - name: Validate collector, billing, API, MCP, WebMCP, UI and dogfood entrypoints
        run: |
          node --check collectors/github-public.mjs
          node --check collectors/url-public.mjs
          node --check browser-scan.mjs
          node --check core/billing.mjs
          node --check core/stripe.mjs
          node --check api/scan.mjs
          node --check api/v1/scan.mjs
          node --check api/billing/checkout.mjs
          node --check api/billing/activate.mjs
          node --check api/billing/portal.mjs
          node --check api/mcp.mjs
          node --check mcp/server.mjs
          node --check webmcp.js
          node --check billing.js
          node --check app.js
          node --check scripts/dogfood.mjs
          node --check scripts/legal-preaudit.mjs
          node --check scripts/legal-audit-request-pack.mjs
          node --check scripts/legal-pilot-readiness.mjs
      - name: Validate versioned procurement profile
        run: node -e "const p=require('./profiles/core-ai-procurement-2026.08.json'); if(!p.id||!p.version||p.controls.length<20) process.exit(1); console.log(p.id,p.version,p.controls.length)"