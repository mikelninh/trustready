name: prospect-engine-v2

on:
  pull_request:
    paths:
      - 'prospecting/v2/**'
      - '.github/workflows/prospect-engine-v2.yml'
  push:
    branches: [main]
    paths:
      - 'prospecting/v2/**'
      - '.github/workflows/prospect-engine-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit tests
        run: node --test prospecting/v2/*.test.mjs
      - name: Scan 50-60 public agent repositories
        run: node prospecting/v2/run-batch.mjs /tmp/trustready-prospect-v2
      - name: Verify calibration invariants
        run: |
          node - <<'NODE'
          const fs=require('fs')
          const p='/tmp/trustready-prospect-v2/prospect-v2-report.json'
          const r=JSON.parse(fs.readFileSync(p,'utf8'))
          if(r.targets < 50 || r.targets > 60) throw new Error(`expected 50-60 targets, got ${r.targets}`)
          if(r.completed < Math.floor(r.targets*0.8)) throw new Error(`too many scan failures: ${r.completed}/${r.targets}`)
          for(const item of r.results.filter(x=>x.signal)){
            if(!item.signal.truthBoundary?.includes('does not execute the target')) throw new Error(`truth boundary missing: ${item.repository}`)
            if(item.signal.classification==='PROOF_GAP' && !item.signal.evidence.selectorFlows?.length) throw new Error(`proof gap lacks selector-flow evidence: ${item.repository}`)
            if(item.expected && item.signal.classification!==item.expected) throw new Error(`calibration mismatch ${item.repository}: expected ${item.expected}, got ${item.signal.classification}`)
            if(item.expectedNot && item.signal.classification===item.expectedNot) throw new Error(`negative calibration regressed ${item.repository}: got forbidden ${item.expectedNot}`)
          }
          if(!r.metrics) throw new Error('calibration metrics missing')
          if(r.metrics.reviewed < 30) throw new Error(`need >=30 human-reviewed repos, got ${r.metrics.reviewed}`)
          if(r.metrics.binaryReviewed < 10) throw new Error(`need >=10 binary labels for precision/recall, got ${r.metrics.binaryReviewed}`)
          if(!Array.isArray(r.metrics.falseNegatives)) throw new Error('false-negative list missing')
          console.log('V2 DISTRIBUTION',r.distribution)
          console.log('V2 REVIEW QUEUE',r.reviewQueue.length)
          console.log('V2 CALIBRATION METRICS',JSON.stringify(r.metrics,null,2))
          NODE
      - name: Upload v2 calibration evidence
        uses: actions/upload-artifact@v4
        with:
          name: trustready-prospect-engine-v2
          path: /tmp/trustready-prospect-v2/
          if-no-files-found: error
