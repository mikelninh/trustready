name: security-posture-v1

on:
  push:
    branches: [main]
    paths:
      - 'core/security-posture.mjs'
      - 'core/security-posture.test.mjs'
      - 'security-portfolio.html'
      - 'security-portfolio.js'
      - '.github/workflows/security-posture.yml'
  pull_request:
    paths:
      - 'core/security-posture.mjs'
      - 'core/security-posture.test.mjs'
      - 'security-portfolio.html'
      - 'security-portfolio.js'
      - '.github/workflows/security-posture.yml'

permissions:
  contents: read

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Security Posture evidence semantics
        run: node --test core/security-posture.test.mjs
      - name: Syntax-check browser portfolio
        run: node --check security-portfolio.js
